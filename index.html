<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Stone</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

.container{
    width:100%;
    min-height:100vh;
    background:brown;
}

.header{
    background:rgb(74, 92, 255);
    width:100%;
    height:60px;
    display:flex;
    align-items:center;
    justify-content:space-around;
}

h1{
    color:white;
    font-family:sans-serif;
}

.navbar{
    display:flex;
    gap:30px;
}

.about{
    color:white;
    text-decoration:none;
    font-family:sans-serif;
    font-weight:bold;
}

.openimg{
    position:relative;
    width:100%;
    height:500px;
    overflow:hidden;
}

.openimg img{
    position:absolute;
    top:0;
    left:0;
    width:100%;
    height:100%;
    object-fit:cover;
}

.slide1{
    animation:slide1 8s infinite;
}

.slide2{
    animation:slide2 8s infinite;
}

@keyframes slide1{
    0%,45%{
        opacity:1;
    }
    50%,95%{
        opacity:0;
    }
    100%{
        opacity:1;
    }
}

@keyframes slide2{
    0%,45%{
        opacity:0;
    }
    50%,95%{
        opacity:1;
    }
    100%{
        opacity:0;
    }
}
</style>
</head>

<body>

<div class="container">

    <div class="header">
        <h1>STONE</h1>

        <div class="navbar">
            <a class="about" href="#">HOME</a>
            <a class="about" href="#">PROMOTION</a>
            <a class="about" href="#">PRODUCTS</a>
            <a class="about" href="#">CONTACT</a>
        </div>
    </div>

    <div class="openimg">
        <img src="img1.jpg" class="slide1" alt="Image 1">
        <img src="img2.jpg" class="slide2" alt="Image 2">
    </div>

</div>

</body>
</html>
